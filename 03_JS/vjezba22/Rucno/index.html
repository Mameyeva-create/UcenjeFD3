<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Alpine</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="alpine.3.17.2.js"></script>
</head>
<body>
    <h1 x-data="{ message: 'I ❤️ Alpine JS' }" x-text="message"></h1>
    <div x-data="{ count: 0 }">
    <button x-on:click="count++">Increment</button>
    <button x-on:click="count--">Decrement</button>
 
    <span x-text="count"></span>
    
</div>
</body>
</html>
