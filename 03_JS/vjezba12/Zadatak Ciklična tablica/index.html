<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciklična matrica</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="ulaz" aria-hidden="true">
            <span>U</span>
            <span>L</span>
            <span>A</span>
            <span>Z</span>
        </div>
        <!-- GLAVNI SADRŽAJ -->
        <div class="controls">
            <div class="input-group">
                <label for="redovi">Broj redaka</label>
                <input type="number" id="redovi" min="2" max="50" value="5">
            </div>
            <div class="input-group">
                <label for="stupci">Broj stupaca</label>
                <input type="number" id="stupci" min="2" max="50" value="5">
            </div>
            <div class="input-group smjer-grupa">
                <label for="smjer">Smjer:</label>
                <select id="smjer">
                    <option value="1">1. Dolje desno - u smjeru kazaljke</option>
                    <option value="2">2. Dolje lijevo - u smjeru kazaljke</option>
                    <option value="3">3. Gore lijevo - u smjeru kazaljke</option>
                    <option value="4">4. Gore desno - u smjeru kazaljke</option>
                    <option value="5">5. Dolje desno - kontra smjer</option>
                    <option value="6">6. Dolje lijevo - kontra smjer</option>
                    <option value="7">7. Gore lijevo - kontra smjer</option>
                    <option value="8">8. Gore desno - kontra smjer</option>
                    <option value="9">9. Sredina - lijevo - u smjeru kazaljke</option>
                    <option value="10">10. Sredina - desno - u smjeru kazaljke</option>
                    <option value="11">11. Sredina - gore - u smjeru kazaljke </option>
                    <option value="12">12. Sredina - dolje - u smjeru kazaljke</option>
                    <option value="13">13. Sredina - lijevo - kontra smjer</option>
                    <option value="14">14. Sredina - desno - kontra smjer</option>
                    <option value="15">15. Sredina - gore - kontra smjer</option>
                    <option value="16">16. Sredina - dolje - kontra smjer</option>
                </select>
            </div>
            <button id="kreiraj" type="button">KREIRAJ TABLICU</button>
        </div>
        <div class="rezultat-wrapper">
            <div id="rezultat"></div>
        </div>
        <div class="izlaz" aria-hidden="true">
            <span>I</span>
            <span>Z</span>
            <span>L</span>
            <span>A</span>
            <span>Z</span>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
